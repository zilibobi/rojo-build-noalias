[package]
name = "rojo-build-noalias"
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.89"
description = "A wrapper around rojo build that replaces Luau alias requires with relative paths"
license = "MIT"

[lib]
name = "rojo_build_noalias"
path = "src/lib.rs"

[[bin]]
name = "rojo-build-noalias"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
dunce = "1.0"
jsonc-parser = { version = "0.34", features = ["serde"] }
notify = "8.2"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tempfile = "3.27"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.2"
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
strip = true
